name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: install · lint · typecheck · test · build · package
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Formatting
        run: npm run format:check

      - name: Unit and integration tests
        run: npm test

      - name: Production build (electron-vite)
        run: npm run build

      - name: Windows packaging (unpacked, unsigned)
        run: npx --no-install electron-builder --win --dir
        env:
          # Non-secret CI: never attempt code signing or publishing here.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Verify packaged output (native module + production CSP)
        run: npm run verify:packaging
