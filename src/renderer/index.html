<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Go Phones POS - native module check</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 2rem; background: #10141a; color: #e8ecf1; }
    h1 { font-size: 1.1rem; }
    pre { background: #1a2028; padding: 1rem; border-radius: 6px; white-space: pre-wrap; }
    .ok { color: #4ade80; }
    .fail { color: #f87171; }
  </style>
</head>
<body>
  <h1>better-sqlite3 native module check (spike, not production UI)</h1>
  <pre id="result">Running check&hellip;</pre>
  <script>
    window.posDiagnostics.checkNativeSqlite().then((result) => {
      const el = document.getElementById('result');
      el.textContent = JSON.stringify(result, null, 2);
      el.className = result.ok ? 'ok' : 'fail';
    });
  </script>
</body>
</html>
